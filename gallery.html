<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図譜 ― 鱗と焔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --void:#120e0a;
    --leather:#241c14;
    --leather-deep:#0f0b08;
    --gold:#c9a24b;
    --gold-bright:#ecce8a;
    --gold-dim:#8a6f36;
    --jade:#3c7c62;
    --crimson:#8a3324;
    --parchment:#ece0c4;
    --parchment-dim:#a89877;
    --display-jp:'Shippori Mincho', serif;
    --display-en:'Cinzel Decorative', serif;
    --body:'Zen Old Mincho', serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--void);
    color:var(--parchment);
    font-family:var(--body);
    line-height:1.9;
    overflow-x:hidden;
  }
  a{color:inherit;}
  ::selection{background:var(--crimson); color:var(--parchment);}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    background:var(--leather-deep);
    border-bottom:1px solid var(--gold-dim);
  }
  .logo{
    font-family:var(--display-jp);
    font-weight:800;
    font-size:21px;
    letter-spacing:0.15em;
    text-decoration:none;
    color:var(--gold-bright);
  }
  nav ul{
    display:flex;
    gap:clamp(16px,3vw,36px);
    list-style:none;
    margin:0; padding:0;
  }
  nav a{
    font-family:var(--display-jp);
    font-size:14px;
    letter-spacing:0.2em;
    text-decoration:none;
    color:var(--parchment-dim);
    transition:color .3s ease;
  }
  nav a.active, nav a:hover{color:var(--gold-bright);}

  .page-hero{
    padding:80px 24px 60px;
    text-align:center;
    background:
      radial-gradient(ellipse 70% 55% at 50% 20%, rgba(201,162,75,0.08), transparent 65%),
      linear-gradient(180deg, var(--leather-deep), var(--void));
    border-bottom:1px solid var(--gold-dim);
  }
  .page-hero .eyebrow{
    font-family:var(--display-en);
    font-size:12px;
    letter-spacing:0.5em;
    color:var(--gold-dim);
    margin:0 0 18px;
  }
  .page-hero h1{
    font-family:var(--display-jp);
    font-weight:800;
    font-size:clamp(36px,5vw,52px);
    margin:0 0 14px;
    letter-spacing:0.1em;
  }
  .page-hero p{
    max-width:480px;
    margin:0 auto;
    font-size:15px;
    color:var(--parchment-dim);
  }

  /* ---------- gallery ---------- */
  .gallery{
    max-width:1040px;
    margin:0 auto;
    padding:0 24px 100px;
  }
  .section-head{
    text-align:center;
    padding:90px 0 44px;
  }
  .section-head .label{
    font-family:var(--display-en);
    font-size:12px;
    letter-spacing:0.45em;
    color:var(--gold-dim);
    display:block;
    margin-bottom:12px;
  }
  .section-head h2{
    font-family:var(--display-jp);
    font-weight:800;
    font-size:clamp(24px,3.4vw,30px);
    margin:0 0 10px;
  }
  .section-head p{
    margin:0;
    font-size:14px;
    color:var(--parchment-dim);
  }

  .plates{
    display:grid;
    gap:34px 28px;
  }
  .plates.manga{grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));}
  .plates.illust{grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));}

  .plate{margin:0;}
  .frame{
    border:1px solid var(--gold-dim);
    padding:8px;
    background:var(--leather-deep);
    transition:border-color .3s ease;
  }
  .plate:hover .frame{border-color:var(--gold);}
  .frame-inner{
    border:1px solid var(--gold-dim);
    display:block;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 60% at 50% 40%, rgba(201,162,75,0.07), transparent 70%),
      var(--leather);
  }
  .manga .frame-inner{aspect-ratio:2/3;}
  .illust .frame-inner{aspect-ratio:4/3;}
  .illust .plate.square .frame-inner{aspect-ratio:1/1;}
  .frame-inner img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
  }
  .empty{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
  }
  .empty .diamond{
    width:14px; height:14px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
  }
  .empty span{
    font-family:var(--display-en);
    font-size:11px;
    letter-spacing:0.35em;
    color:var(--gold-dim);
  }

  figcaption{
    padding:14px 4px 0;
  }
  .cap-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .cap-no{
    font-family:var(--display-en);
    font-size:11px;
    letter-spacing:0.25em;
    color:var(--gold);
  }
  .cap-tag{
    font-family:var(--display-jp);
    font-size:11px;
    letter-spacing:0.1em;
    padding:1px 9px;
    border:1px solid var(--jade);
    color:var(--jade);
  }
  .cap-tag.west{border-color:var(--crimson); color:var(--crimson);}
  .cap-tag.both{border-color:var(--gold); color:var(--gold);}
  .cap-title{
    font-family:var(--display-jp);
    font-weight:700;
    font-size:16px;
    margin:6px 0 0;
  }
  .cap-note{
    font-size:12.5px;
    color:var(--parchment-dim);
    margin:2px 0 0;
    line-height:1.7;
  }

  .gold-rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:80px auto 0;
  }
  .gold-rule .line{
    height:1px;
    width:64px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .gold-rule .dot{
    width:6px; height:6px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(8,6,4,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border:1px solid var(--gold);
    padding:8px;
    background:var(--leather-deep);
  }

  @media (max-width:560px){
    nav ul{gap:12px;}
    nav a{font-size:12px; letter-spacing:0.1em;}
    .plates.illust{grid-template-columns:1fr;}
  }

  footer{
    padding:56px clamp(20px,6vw,80px) 34px;
    font-size:12.5px;
    color:var(--parchment-dim);
    border-top:1px solid var(--gold-dim);
  }
  .footer-grid{
    display:flex;
    flex-wrap:wrap;
    gap:36px;
    justify-content:space-between;
    margin-bottom:34px;
  }
  .footer-col h5{
    font-family:var(--display-jp);
    font-size:13px;
    letter-spacing:0.15em;
    color:var(--gold);
    margin:0 0 12px 0;
  }
  .footer-col p, .footer-col a{
    display:block;
    font-size:12.5px;
    color:var(--parchment-dim);
    text-decoration:none;
    margin-bottom:7px;
  }
  .footer-col a:hover{color:var(--gold-bright);}
  .footer-bottom{
    border-top:1px solid rgba(201,162,75,0.25);
    padding-top:20px;
    font-size:11.5px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:space-between;
  }

</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">鱗と焔</a>
  <nav>
    <ul>
      <li><a href="index.html">ホーム</a></li>
      <li><a href="blog.html">日誌</a></li>
      <li><a class="active" href="gallery.html">図譜</a></li>
      <li><a href="about.html">由来</a></li>
    </ul>
  </nav>
</header>

<section class="page-hero">
  <p class="eyebrow">PLATES &amp; PAGES</p>
  <h1>図譜</h1>
  <p>龍と竜を描いた漫画とイラストを、書物の挿図のように並べていきます。</p>
</section>

<main class="gallery">

  <!--
    作品の差し替え方:
    <span class="empty">…</span> の部分を消して、
    <img src="images/ファイル名.png" alt="作品の説明"> を入れてください。
    縦長の漫画は 2:3、イラストは 4:3（square クラス付きは 1:1）で表示されます。
  -->

  <div class="section-head">
    <span class="label">CHAPTER I</span>
    <h2>漫画</h2>
    <p>龍と竜が出てくる漫画。</p>
  </div>

  <div class="plates manga">

    <figure class="plate">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE I</span><span class="cap-tag west">西</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

    <figure class="plate">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE II</span><span class="cap-tag">東</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

    <figure class="plate">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE III</span><span class="cap-tag both">東西</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

  </div>

  <div class="gold-rule"><span class="line"></span><span class="dot"></span><span class="line"></span></div>

  <div class="section-head">
    <span class="label">CHAPTER II</span>
    <h2>イラスト</h2>
    <p>龍と竜を描いた一枚絵。</p>
  </div>

  <div class="plates illust">

    <figure class="plate">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE IV</span><span class="cap-tag west">西</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

    <figure class="plate">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE V</span><span class="cap-tag">東</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

    <figure class="plate square">
      <div class="frame"><div class="frame-inner">
        <span class="empty"><i class="diamond"></i><span>COMING SOON</span></span>
      </div></div>
      <figcaption>
        <div class="cap-top"><span class="cap-no">PLATE VI</span><span class="cap-tag both">東西</span></div>
        <p class="cap-title">作品タイトル</p>
        <p class="cap-note">ひとこと説明がここに入ります。</p>
      </figcaption>
    </figure>

  </div>

</main>

<div class="lightbox" id="lightbox"><img src="" alt=""></div>

<footer>
  <div class="footer-grid">
    <div class="footer-col">
      <h5>CONTACT</h5>
      <p style="margin-bottom:10px;">ご意見・ご感想はこちらから</p>
      <a href="about.html#contact">お問い合わせフォーム</a>
    </div>
    <div class="footer-col">
      <h5>NAVIGATE</h5>
      <a href="index.html">ホーム</a>
      <a href="blog.html">日誌</a>
      <a href="gallery.html">図譜</a>
      <a href="about.html">由来</a>
    </div>
    <div class="footer-col">
      <h5>AZALEA CREATIVE ROOM</h5>
      <a href="#">創作の拠点はこちら</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>本サイトの画像・文章・作品について、AI学習への利用、トレース、無断転載、二次利用を禁止します。</span>
    <span>© 鱗と焔</span>
  </div>
</footer>

<script>
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.frame-inner img').forEach(function(img){
    img.addEventListener('click', function(){
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lb.classList.add('open');
    });
  });
  lb.addEventListener('click', function(){ lb.classList.remove('open'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ lb.classList.remove('open'); }
  });
</script>

</body>
</html>
